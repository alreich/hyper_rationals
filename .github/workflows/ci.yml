name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hyprat with test extras
        run: pip install -e ".[test]"

      - name: Run unit tests
        run: pytest

      - name: Run doctests
        run: pytest --doctest-modules src/hyprat

  test-interop:
    name: Test interoperability extras (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # sympy, numpy-quaternion, quaternionic and numpy are optional -- the
      # interoperability methods (to_sympy/from_sympy, to_numpy_quaternion/
      # from_numpy_quaternion, to_quaternionic/from_quaternionic) and the
      # matrix methods (to_matrix/from_matrix) import them lazily, and none
      # of them is ever a runtime dependency of hyprat.  The "test" job above
      # runs the full suite without them installed, where the tests that need
      # one are skipped; this job installs the "interop" extra instead, so the
      # whole suite (interoperability AND matrix-representation tests) runs.
      - name: Install hyprat with test and interop extras
        run: pip install -e ".[test,interop]"

      # gint (Gaussian integers/rationals: Zi and Qi) is optional too, and is
      # installed from GitHub, NOT from PyPI: the name "gint" on PyPI belongs to
      # an unrelated package.  It is what the Hy.to_qi/to_zi/from_gint
      # conversions and their Qi-vs-Hy cross-check tests use.
      - name: Install gint (Gaussian integers/rationals) from GitHub
        run: pip install "git+https://github.com/alreich/gaussian-integers.git"

      - name: Run the full unit-test suite (including interoperability and matrix tests)
        run: pytest -v

      - name: Fail if any test was skipped
        run: |
          pytest -rs -q 2>&1 | tee /tmp/pytest.log
          if grep -q "^SKIPPED" /tmp/pytest.log; then
            echo "::error::a test was skipped even though all optional packages are installed"
            exit 1
          fi

      - name: Run doctests
        run: pytest --doctest-modules src/hyprat

  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hyprat with docs extras
        run: pip install -e ".[docs]"

      - name: Build Sphinx docs
        run: sphinx-build -b html docs/source docs/_build/html
