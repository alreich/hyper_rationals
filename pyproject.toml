[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprat"
version = "0.1.0"
description = "Exact rational hypercomplex numbers via the Cayley-Dickson construction (reals, complex, quaternions, octonions, ...)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Alfred J. Reich" }
]
keywords = [
    "hypercomplex",
    "quaternion",
    "octonion",
    "cayley-dickson",
    "rational numbers",
    "abstract algebra",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]
dev = ["pytest>=7", "sphinx>=7", "sphinx-rtd-theme>=2"]

[project.urls]
Homepage = "https://github.com/alreich/hyper_rationals"
Repository = "https://github.com/alreich/hyper_rationals"
Documentation = "https://hyper-rationals.readthedocs.io"
Issues = "https://github.com/alreich/hyper_rationals/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
